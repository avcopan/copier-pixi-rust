name: test

on:
  push:
    branches: ["**"]  # all branches, but not tags (releases run this workflow themselves)
  pull_request:
  workflow_dispatch:
  workflow_call:  # allows the release workflow to run the tests first

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Cache Rust build artifacts in target/ to speed up compilation
      - uses: Swatinem/rust-cache@v2

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          environments: dev test test-lowest

      - name: Run pre-commit hooks
        run: pixi run pre-commit

      - name: Run tests with coverage report
        run: pixi run test

      - name: Run tests with lowest dependency versions
        run: pixi run test-lowest
