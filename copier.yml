_subdirectory: template

_message_after_copy: |
  Your project has been created in {{ _copier_conf.dst_path }}.
  Next, set up your GitHub repository and package publication as described here:
    https://github.com/avcopan/copier-pixi-rust#prepare-remote-github-repository
  Then initialize your local repository:
    cd {{ _copier_conf.dst_path }}
    pixi run init

# questions
package_name:
  type: str
  help: Package name
  validator: "{% if not package_name.isidentifier() or package_name != package_name.lower() %}Use lowercase letters, digits, and underscores, starting with a letter{% endif %}"

description:
  type: str
  help: Short package description (required by crates.io)

author_name:
  type: str
  help: Author name

author_email:
  type: str
  help: Author email

github_org_name:
  type: str
  help: GitHub username or organization

prefix_channel:
  type: str
  help: prefix.dev channel (e.g. <namespace> or <namespace>/<channel>)

polars_plugin:
  type: bool
  help: Include a Polars expression plugin?
  default: false
