_subdirectory: template

_message_after_copy: |
  Your project has been created in {{ _copier_conf.dst_path }}.
  Next, set up your GitHub repository and package publication as described here:
    https://github.com/avcopan/copier-pixi-rust#prepare-remote-github-repository
  Then initialize your local repository:
    cd {{ _copier_conf.dst_path }}
    pixi run init

# questions
package_name:
  type: str
  help: Package name
  validator: "{% if not package_name.isidentifier() or package_name != package_name.lower() %}Use lowercase letters, digits, and underscores, starting with a letter{% endif %}"

repo_name:
  type: str
  help: GitHub repository name
  default: "{{ package_name }}"

description:
  type: str
  help: Short package description (required by crates.io)

keywords:
  type: yaml
  help: crates.io keywords, as a list (e.g. [chemistry, graph]; at most 5)
  validator: "{% if keywords is string or keywords | length == 0 or keywords | length > 5 %}Enter a list of 1 to 5 keywords{% endif %}"

categories:
  type: yaml
  help: crates.io category slugs, as a list (e.g. [science]; see https://crates.io/category_slugs)
  validator: "{% if categories is string or categories | length == 0 or categories | length > 5 %}Enter a list of 1 to 5 category slugs{% endif %}"

author_name:
  type: str
  help: Author name

author_email:
  type: str
  help: Author email

github_org_name:
  type: str
  help: GitHub username or organization

prefix_channel:
  type: str
  help: prefix.dev channel (e.g. <namespace> or <namespace>/<channel>)

polars_plugin:
  type: bool
  help: Include a Polars expression plugin?
  default: false
